[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "efa-mcp"
version = "0.2.0"
description = "EFA transit API integration: Python library, MCP server, and CLI"
authors = [{name = "Dimitri Rebrikov"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=0.9.0"]
all = ["efa-mcp[mcp]"]

[project.urls]
Homepage = "https://github.com/dimitri-rebrikov/efa-mcp"
Repository = "https://github.com/dimitri-rebrikov/efa-mcp.git"

[project.scripts]
efa-mcp = "efa_mcp.server:main"
efa = "efa_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/efa_lib", "src/efa_mcp", "src/efa_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/efa_lib", "src/efa_mcp", "src/efa_cli"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
